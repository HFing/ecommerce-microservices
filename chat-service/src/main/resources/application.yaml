server:
  port: 8085

spring:
  application:
    name: chat-service
  mongodb:
    uri: mongodb://root:root@localhost:27017/chat_service?authSource=admin
  data:
    mongodb:
      auto-index-creation: true

eureka:
  instance:
    hostname: localhost
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
